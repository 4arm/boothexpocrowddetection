<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IRIV PiControl - Dynamic Multi-Region Analytics</title>
    <style>
        body { margin: 0; background-color: #1a1a1a; color: #ffffff; font-family: Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .main-container { display: flex; width: 100%; padding: 20px; box-sizing: border-box; gap: 20px; }
        .video-section { flex: 3; background-color: #000; border: 2px solid #333; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .video-wrapper { position: relative; display: inline-block; width: 100%; height: auto; line-height: 0; }
        #video-feed { width: 100%; height: auto; display: block; }
        #drawing-canvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: pointer; }
        
        .controls { padding: 15px; background-color: #2a2a2a; display: flex; gap: 10px; z-index: 20; align-items: center; flex-wrap: wrap; }
        button, select { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        select { background-color: #333; }
        button.active { background-color: #2196F3; }
        button.danger { background-color: #f44336; }
        button.delete-btn { background-color: #b71c1c; }
        button.report-btn { background-color: #4a7ebb; margin-left: auto; }
        
        .stats-section { flex: 1; background-color: #2a2a2a; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        
        /* Dynamic Zone Cards */
        .zone-card { background-color: #1a1a1a; padding: 15px; border-radius: 8px; border-left: 5px solid #2196F3; margin-bottom: 10px; }
        .zone-title { margin: 0 0 10px 0; font-size: 18px; color: #fff; border-bottom: 1px solid #333; padding-bottom: 5px;}
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; color: #aaa;}
        .stat-val { font-weight: bold; color: #fff; }
        .highlight-val { color: #ff4444; font-size: 18px; }

        /* Report Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .report-modal-content { background-color: #fff; margin: 5% auto; padding: 20px; width: 95%; max-height: 85vh; border-radius: 8px; color: #000; overflow: auto; }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; text-align: center;}
        .report-table th, .report-table td { border: 1px solid #fff; padding: 12px 8px; }
        .report-table th { background-color: #4a7ebb; color: #fff; font-weight: bold; border: 1px solid #fff;}
        .report-table tbody tr:nth-child(even) { background-color: #e9eff5; }
        .report-table tbody tr:nth-child(odd) { background-color: #d3dfea; }
        .report-close { color: #000; font-size: 28px; float: right; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>

<div class="main-container">
    <div class="video-section">
        <div class="video-wrapper">
            <img id="video-feed" src="/video_feed" alt="Video Feed">
            <canvas id="drawing-canvas"></canvas>
        </div>
        <div class="controls">
            <select id="zone-selector"></select>
            <button id="btn-draw" onclick="toggleDrawing()">Draw Selected Zone</button>
            <button onclick="addNewZone()">+ Create New Zone</button>
            <button class="danger" onclick="clearCurrent()">Clear Current</button>
            <button class="delete-btn" onclick="deleteCurrentZone()">Delete Zone</button>
            <button onclick="saveConfig()">Save AI Config</button>
            <button class="report-btn" onclick="showReport()">View Report Table</button>
        </div>
    </div>

    <!-- Right Panel dynamically populated by JS -->
    <div class="stats-section" id="dynamic-stats-panel">
        <h3 style="margin-top: 0; color: #aaa; text-align: center;">Waiting for Zone Data...</h3>
    </div>
</div>

<!-- Detailed Data Report Modal -->
<div id="reportModal" class="modal">
    <div class="report-modal-content">
        <span class="report-close" onclick="closeReport()">&times;</span>
        <h2 style="margin: 0; color: #4a7ebb;">Booth Analytics Report</h2>
        <table class="report-table" id="dynamic-report-table">
            <thead id="report-head"></thead>
            <tbody id="report-body"></tbody>
        </table>
    </div>
</div>

<script>
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('video-feed');
    const selector = document.getElementById('zone-selector');
    
    let isDrawing = false;
    let zones = {};
    
    // Vibrant colors for dynamic zones
    const colors = ['#FF5722', '#00BCD4', '#8BC34A', '#E91E63', '#9C27B0', '#FFC107'];
    function getZoneColor(index) { return colors[index % colors.length]; }

    function syncCanvasSize() {
        if (video.clientWidth > 0 && video.clientHeight > 0) {
            canvas.width = video.clientWidth;
            canvas.height = video.clientHeight;
            redraw();
        }
    }
    video.addEventListener('load', syncCanvasSize);
    window.addEventListener('resize', syncCanvasSize);

    fetch('/get_config').then(res => res.json()).then(data => {
        zones = data.zones || {};
        updateDropdown();
        setTimeout(syncCanvasSize, 300);
    });

    function updateDropdown() {
        selector.innerHTML = '';
        for (let key in zones) {
            let opt = document.createElement("option");
            opt.value = key;
            opt.text = key;
            selector.add(opt);
        }
    }

    function addNewZone() {
        const zoneName = prompt("Enter a name for the new zone (e.g., Entrance, VIP, Zone A):");
        if (zoneName && !zones[zoneName]) {
            zones[zoneName] = [];
            updateDropdown();
            selector.value = zoneName;
        }
    }

    function toggleDrawing() {
        if (!selector.value) return alert("Please create or select a zone first!");
        isDrawing = !isDrawing;
        const btn = document.getElementById('btn-draw');
        if (isDrawing) {
            btn.classList.add('active');
            btn.innerText = "Finish Drawing";
            canvas.style.cursor = "crosshair";
        } else {
            btn.classList.remove('active');
            btn.innerText = "Draw Selected Zone";
            canvas.style.cursor = "pointer";
        }
    }

    function clearCurrent() {
        if (selector.value) {
            zones[selector.value] = [];
            redraw();
        }
    }

    // UPDATED: Completely deletes the zone and automatically triggers a save
    function deleteCurrentZone() {
        const selectedZone = selector.value;
        if (!selectedZone) {
            alert("No zone selected to delete.");
            return;
        }
        
        if (confirm(`Are you sure you want to completely delete "${selectedZone}"?`)) {
            // Remove the zone from the dictionary entirely
            delete zones[selectedZone];
            
            // Turn off drawing mode if it was active
            if (isDrawing) {
                toggleDrawing(); 
            }
            
            // Refresh the UI
            updateDropdown();
            redraw();
            
            // Auto-save so the backend stops sending live stats for it immediately
            fetch('/save_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ zones: zones })
            }).then(() => {
                alert(`Zone "${selectedZone}" has been deleted and configuration saved.`);
            });
        }
    }

    canvas.addEventListener('click', (e) => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        const x = Math.round(clickX / canvas.width * 1280);
        const y = Math.round(clickY / canvas.height * 720);
        
        zones[selector.value].push([x, y]);
        redraw();
    });

    function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let colorIndex = 0;
        
        for (let key in zones) {
            const pts = zones[key];
            if (pts.length === 0) continue;
            
            const strokeColor = getZoneColor(colorIndex++);
            const fillColor = strokeColor + '40'; // Add transparency hex
            
            ctx.beginPath();
            ctx.moveTo(pts[0][0] / 1280 * canvas.width, pts[0][1] / 720 * canvas.height);
            for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i][0] / 1280 * canvas.width, pts[i][1] / 720 * canvas.height);
            }
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = strokeColor;
            ctx.font = "bold 16px Arial";
            ctx.fillText(key, (pts[0][0] / 1280 * canvas.width), (pts[0][1] / 720 * canvas.height) - 8);
        }
    }

    function saveConfig() {
        fetch('/save_config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ zones: zones })
        })
        .then(res => res.json())
        .then(data => alert(data.message));
    }

    // --- Dynamic Report Modal Logic ---
    function closeReport() { document.getElementById('reportModal').style.display = "none"; }
    function showReport() {
        document.getElementById('reportModal').style.display = "block";
        document.getElementById('report-body').innerHTML = '<tr><td>Loading data from InfluxDB...</td></tr>';
        
        fetch('/get_report')
            .then(res => res.json())
            .then(data => {
                const thead = document.getElementById('report-head');
                const tbody = document.getElementById('report-body');
                thead.innerHTML = '';
                tbody.innerHTML = '';
                
                const dates = Object.keys(data.dates).sort();
                
                // UPDATED: Filter out historical zones that are no longer active in the config
                const dbZones = data.zones.filter(z => zones.hasOwnProperty(z)).sort(); 
                
                if (dates.length === 0 || dbZones.length === 0) {
                    tbody.innerHTML = '<tr><td>No historical data available for active zones.</td></tr>';
                    return;
                }

                // Build Table Header Dynamically
                let headRow1 = `<tr><th rowspan="2" style="vertical-align: middle;">Date</th>`;
                let headRow2 = `<tr>`;
                
                dbZones.forEach(z => {
                    headRow1 += `<th colspan="4">${z}</th>`;
                    headRow2 += `<th>Crowd 1 (<5s)</th><th>Crowd 2 (5-15s)</th><th>Crowd 3 (15s–15m)</th><th>Crowd Total</th>`;
                });
                headRow1 += `</tr>`;
                headRow2 += `</tr>`;
                thead.innerHTML = headRow1 + headRow2;

                // Build Table Body Dynamically
                dates.forEach(date => {
                    let tr = `<tr><td>${date}</td>`;
                    dbZones.forEach(z => {
                        const zData = data.dates[date][z] || {crowd_1: 0, crowd_2: 0, crowd_3: 0, total: 0};
                        tr += `<td>${zData.crowd_1}</td><td>${zData.crowd_2}</td><td>${zData.crowd_3}</td><td style="font-weight:bold;">${zData.total}</td>`;
                    });
                    tr += `</tr>`;
                    tbody.innerHTML += tr;
                });
            });
    }

    // --- Live Dynamic Background Stats Panel ---
    setInterval(() => {
        fetch('/get_stats')
            .then(res => res.json())
            .then(data => {
                const panel = document.getElementById('dynamic-stats-panel');
                panel.innerHTML = ''; // Clear previous
                
                let colorIndex = 0;
                for (let zoneName in data) {
                    // UPDATED: Skip drawing stats for zones that have been deleted from the frontend
                    if (!zones.hasOwnProperty(zoneName)) continue;

                    const stats = data[zoneName];
                    const color = getZoneColor(colorIndex++);
                    
                    const card = `
                        <div class="zone-card" style="border-left-color: ${color};">
                            <h3 class="zone-title">${zoneName}</h3>
                            <div class="stat-row"><span>Live Customers:</span> <span class="stat-val highlight-val">${stats.current}</span></div>
                            <div class="stat-row"><span>Staff in Zone:</span> <span class="stat-val" style="color: #FFA500;">${stats.staff || 0}</span></div>
                            <div class="stat-row"><span>Total Unique Customers:</span> <span class="stat-val">${stats.total}</span></div>
                            <div class="stat-row" style="margin-top:10px;"><span>Crowd 1 (< 5s):</span> <span class="stat-val">${stats.crowd_1}</span></div>
                            <div class="stat-row"><span>Crowd 2 (5 - 15s):</span> <span class="stat-val">${stats.crowd_2}</span></div>
                            <div class="stat-row"><span>Crowd 3 (15s - 15m):</span> <span class="stat-val">${stats.crowd_3}</span></div>
                        </div>
                    `;
                    panel.innerHTML += card;
                }
            });
    }, 1000);
</script>
</body>
</html>
